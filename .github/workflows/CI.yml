name: CI
# Run on master, tags, or any pull request
on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC (8 PM CST)
  push:
    branches: [master]
    tags: ["*"]
    paths-ignore:
      - '**.md'
      - 'docs'
  pull_request:
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.11"  
          - "1"    # Latest Release
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - x64
        # exclude:
        #  # Test 32-bit only on Linux
        #  - os: macOS-latest
        #    arch: x86
        #  - os: windows-latest
        #    arch: x86
        # include:
          # Add a 1.5 job because that's what Invenia actually uses
          # - os: ubuntu-latest
          #  version: 1.5
          #  arch: x64
    steps:
      - uses: actions/checkout@v3
      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: actions/cache@v3
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-${{ matrix.arch }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-${{ matrix.arch }}-test-
            ${{ runner.os }}-${{ matrix.arch }}-
            ${{ runner.os }}-
      - uses: julia-actions/julia-buildpkg@latest
      - run: |
          git config --global user.name Tester
          git config --global user.email te@st.er
      - uses: julia-actions/julia-runtest@latest
      - uses: julia-actions/julia-processcoverage@v1
      # - uses: codecov/codecov-action@v1
      #  with:
      #    file: lcov.info

  latticematrices-compat:
    name: LatticeMatrices ${{ matrix.latticematrices }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        latticematrices:
          - "1.2.0"
    steps:
      - uses: actions/checkout@v3
      - uses: julia-actions/setup-julia@v1
        with:
          version: "1.11"
          arch: x64
      - uses: actions/cache@v3
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-x64-latticematrices-${{ matrix.latticematrices }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-x64-latticematrices-
            ${{ runner.os }}-x64-
            ${{ runner.os }}-
      - name: Pin LatticeMatrices
        env:
          LATTICEMATRICES_VERSION: ${{ matrix.latticematrices }}
        run: >-
          julia --project=. -e '
          using Pkg;
          version = VersionNumber(ENV["LATTICEMATRICES_VERSION"]);
          Pkg.add(PackageSpec(name="LatticeMatrices", version=version));
          Pkg.status()'
      - uses: julia-actions/julia-runtest@latest

  serial-without-mpi:
    name: Serial without MPI.jl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: julia-actions/setup-julia@v1
        with:
          version: "1.11"
          arch: x64
      - uses: actions/cache@v3
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-x64-serial-no-mpi-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-x64-serial-no-mpi-${{ env.cache-name }}-
            ${{ runner.os }}-x64-
            ${{ runner.os }}-
      - name: Install without MPI and run a serial smoke test
        env:
          JULIA_LOAD_PATH: "@:@stdlib"
        run: >-
          julia --startup-file=no -e '
          using Pkg;
          Pkg.activate("serial-test");
          Pkg.develop(path=pwd());
          Pkg.add("JACC");
          @assert Base.find_package("MPI") === nothing;
          import JACC;
          JACC.@init_backend;
          using Gaugefields;
          @assert Base.get_extension(Gaugefields, :GaugefieldsMPIExt) === nothing;
          U = gauge_configuration((4, 4); colors=2, start=:cold, process_grid=(1, 1));
          @assert gauge_communicator(U) isa SerialCommunicator;
          @assert measure_plaquette(U) ≈ 1'

  mpi:
    name: MPI extension (1 and 2 ranks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: julia-actions/setup-julia@v1
        with:
          version: "1.11"
          arch: x64
      - uses: actions/cache@v3
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-x64-mpi-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-x64-mpi-${{ env.cache-name }}-
            ${{ runner.os }}-x64-
            ${{ runner.os }}-
      - name: Install MPI test dependencies
        run: >-
          julia --startup-file=no -e '
          using Pkg;
          Pkg.activate("mpi-test");
          Pkg.develop(path=pwd());
          Pkg.add(["JACC", "JLD2", "LatticeMatrices", "MPI"]);
          using MPI;
          MPI.install_mpiexecjl(destdir="mpi-test/bin")'
      - name: Check lazy MPI lifecycle
        run: |
          mpi-test/bin/mpiexecjl --project=mpi-test -n 1 julia --startup-file=no --project=mpi-test test/MPIJACCtest/mpi_lifecycle.jl
          mpi-test/bin/mpiexecjl --project=mpi-test -n 1 julia --startup-file=no --project=mpi-test test/MPIJACCtest/mpi_legacy_lifecycle.jl
          mpi-test/bin/mpiexecjl --project=mpi-test -n 1 julia --threads=1 --startup-file=no --project=mpi-test test/MPIJACCtest/gaugefixing_legacy_backends.jl
      - name: Run two-rank API tests
        run: |
          mpi-test/bin/mpiexecjl --project=mpi-test -n 2 julia --startup-file=no --project=mpi-test test/MPIJACCtest/high_level_api.jl
          GAUGEFIELDS_TEST_MPI=true mpi-test/bin/mpiexecjl --project=mpi-test -n 2 julia --startup-file=no --project=mpi-test test/MPIJACCtest/three_dimensional.jl
          mpi-test/bin/mpiexecjl --project=mpi-test -n 2 julia --startup-file=no --project=mpi-test test/MPIJACCtest/ildg_io.jl
          mpi-test/bin/mpiexecjl --project=mpi-test -n 2 julia --threads=1 --startup-file=no --project=mpi-test test/MPIJACCtest/gaugefixing_legacy_backends.jl
